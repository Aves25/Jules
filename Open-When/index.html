<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Aves">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Open When You're...❤️</title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="container">

        <h1>Open When...</h1>

        <p class="subtitle">
            Pick whichever envelope matches how you're feeling.
        </p>

        <div class="envelope-grid">

            <div class="envelope" data-message="happy">
                <div class="emoji">😊</div>
                <h2>Happy</h2>
            </div>

            <div class="envelope" data-message="sad">
                <div class="emoji">😔</div>
                <h2>Sad</h2>
            </div>

            <div class="envelope" data-message="tired">
                <div class="emoji">😴</div>
                <h2>Tired</h2>
            </div>

            <div class="envelope" data-message="stressed">
                <div class="emoji">😥</div>
                <h2>Stressed</h2>
            </div>

            <div class="envelope" data-message="excited">
                <div class="emoji">🎉</div>
                <h2>Excited</h2>
            </div>

            <div class="envelope" data-message="miss-me">
                <div class="emoji">❤️</div>
                <h2>Missing Me</h2>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

    </body>
</html>
